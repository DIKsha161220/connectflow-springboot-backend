spring.application.name=connectflow-backend

# Default PostgreSQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/connectflow_crm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Reuse external local connection settings if available
spring.config.import=optional:file:D:/backendd/connectflow-backend/src/main/resources/application.properties

# Hibernate and JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.sql.init.mode=never

spring.jackson.default-property-inclusion=non_null
server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYtY29ubmVjdGZsb3ctc2VjcmV0LWtleS0yMDI2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

logging.level.org.springframework.security=INFO
