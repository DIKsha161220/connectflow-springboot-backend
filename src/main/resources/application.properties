spring.application.name=connectflow-backend

# PostgreSQL Database Connection (Supports both Render Cloud and Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/connectflow_crm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate and JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public

spring.jackson.default-property-inclusion=non_null
server.port=${PORT:8080}

app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYtY29ubmVjdGZsb3ctc2VjcmV0LWtleS0yMDI2
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=*

spring.main.allow-bean-definition-overriding=true

logging.level.org.springframework.security=INFO
